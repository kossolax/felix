name: release

# Publier : git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - name: Sprites d'origine (pour les tests seulement, pas dans le paquet)
        shell: bash
        run: |
          gh release download original-felix2 -p felix2.exe -D assets/cache || true
          python tools/extract_felix.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: pyinstaller --noconfirm felix.spec
      - name: Selftest de l'exe
        shell: pwsh
        run: |
          $env:FELIX_ASSETS = "$pwd\assets\original"
          $p = Start-Process -FilePath dist\felix\felix.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\felix\felix.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Archive
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path dist\felix -DestinationPath "virtual-felix-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: virtual-felix-*-windows-x64.zip

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances système (Qt, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1 libgl1 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libfontconfig1
      - run: pip install -r requirements.txt pyinstaller
      - name: Sprites d'origine (pour les tests seulement, pas dans le paquet)
        run: |
          gh release download original-felix2 -p felix2.exe -D assets/cache || true
          python tools/extract_felix.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: |
          pyinstaller --noconfirm felix.spec
          tools/build_deb.sh "${GITHUB_REF_NAME#v}"
      - name: Installation du paquet et selftest
        run: |
          sudo apt-get install -y ./dist/virtual-felix_*_amd64.deb
          QT_QPA_PLATFORM=offscreen FELIX_ASSETS="$PWD/assets/original" virtual-felix --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/virtual-felix_*_amd64.deb

  publish:
    needs: [windows, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Release GitHub
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ## Virtual Felix $version

          - **Ubuntu 24.04+ / Debian** : \`virtual-felix_${version}_amd64.deb\` → \`sudo apt install ./virtual-felix_${version}_amd64.deb\`, puis « Virtual Felix » dans le menu.
            Sous **Wayland** (session par défaut d'Ubuntu), activez l'extension fournie pour que le chat voie les fenêtres :
            \`gnome-extensions enable felix-helper@kossolax.github.io\`, puis déconnexion / reconnexion.
          - **Windows 10/11** : \`virtual-felix-${version}-windows-x64.zip\` → dézipper, lancer \`felix\\felix.exe\`.

          Au premier lancement, Felix récupère les graphismes d'origine (felix2.exe, 758 Ko) sur archive.org
          ou dans la release [original-felix2](https://github.com/${GITHUB_REPOSITORY}/releases/tag/original-felix2),
          ou vous propose de choisir un felix2.exe déjà téléchargé. Aucun graphisme d'origine n'est inclus dans ces paquets.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "Virtual Felix $version" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
